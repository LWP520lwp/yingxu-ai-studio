map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}
upstream workbench_api {
    server api:8088;
    keepalive 32;
}
log_format workbench_safe '$request_method $uri $server_protocol $status $body_bytes_sent $request_time';
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 101m;
    server_tokens off;
    # OAuth codes/state and other query parameters must not be persisted in access logs.
    access_log /dev/stdout workbench_safe;
    sendfile on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
    location = /api/events {
        proxy_pass http://workbench_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header X-Accel-Buffering no;
    }
    location ~ ^/(api|oauth2|login)(/|$) {
        proxy_pass http://workbench_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location ~ ^/(assets/|canvas-engine/assets/).+\.(js|css|woff2?|png|webp|jpg|svg)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }
    # Never return the host SPA for a missing iframe entry/resource.
    location /canvas-engine/ {
        try_files $uri =404;
        add_header Cache-Control 'no-cache';
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control 'no-cache';
    }
}

