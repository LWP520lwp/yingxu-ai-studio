<!doctype html>
<html lang="zh-CN" class="font-sans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="映序 AI 画布：节点化多模态内容创作与工作流编排"
    />
    <link rel="icon" href="/canvas-engine/logo.svg" />
    <title>映序 AI 画布</title>
    <script>
      try {
        var s = JSON.parse(
          localStorage.getItem("yingxu-atlas:theme_store:v2") || "{}",
        );
        var t = s.state && s.state.theme === "light" ? "light" : "dark";
        document.documentElement.classList.toggle("dark", t === "dark");
        document.documentElement.style.colorScheme = t;
      } catch (e) {}
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
